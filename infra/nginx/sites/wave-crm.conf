server {
  listen 80;
  server_name wavecrm.com.br www.wavecrm.com.br;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name wavecrm.com.br www.wavecrm.com.br;

  ssl_certificate /etc/letsencrypt/live/wavecrm.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wavecrm.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  root /var/www/html;
  index index.html;

  # Frontend
  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_redirect off;
  }

  # Backend API
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90;

    # CORS headers
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-tenant-id" always;
    add_header Access-Control-Allow-Credentials true always;

    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # Swagger Docs
  location /api/docs {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # WebSocket for Evolution API
  location /ws/ {
    proxy_pass http://evolution-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Static files cache
  location /_next/static {
    proxy_pass http://frontend:3000;
    proxy_cache_valid 200 302 60m;
    proxy_cache_valid 404 1m;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
