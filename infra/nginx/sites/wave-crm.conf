server {
  listen 80;
  server_name wavecrm.com.br www.wavecrm.com.br;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name wavecrm.com.br www.wavecrm.com.br;

  ssl_certificate /etc/letsencrypt/live/wavecrm.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wavecrm.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security headers (note: locations that declare their own add_header
  # directives must repeat these, since nginx add_header is not merged)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Only allow CORS for known origins (empty value = header not sent)
  set $cors_origin "";
  if ($http_origin ~* ^https://(www\.)?wavecrm\.com\.br$) {
    set $cors_origin $http_origin;
  }

  root /var/www/html;
  index index.html;

  # SSE (Server-Sent Events) — must come BEFORE the generic /api/ block
  location /api/v1/events {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600;
    chunked_transfer_encoding on;
  }

  # Backend API
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90;

    # CORS headers — restricted to known origins ($cors_origin set above)
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-tenant-id" always;
    add_header Access-Control-Allow-Credentials true always;

    # Re-declare security headers (add_header in a location overrides server-level)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # WebSocket for Evolution API
  location /ws/ {
    proxy_pass http://evolution-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Static files — long cache
  location /_next/static {
    proxy_pass http://frontend:3000;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Re-declare security headers (add_header in a location overrides server-level)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Frontend (must be last)
  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_redirect off;
  }

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
